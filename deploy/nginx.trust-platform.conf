server {
    listen 28101;
    server_name 192.168.21.103;

    client_max_body_size 101m;

    root /opt/trust-ai-review-demo/frontend/dist;
    index index.html;

    location = /rule-library {
        return 301 /rule-library/;
    }

    location ^~ /rule-library/ {
        alias /opt/trust-rule-engine/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /rule-library/index.html;
    }

    location ^~ /api/rule-library/ {
        proxy_pass http://127.0.0.1:18102/api/rule-library/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/rule-engine/ {
        proxy_pass http://127.0.0.1:18102/api/rule-engine/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18101/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
