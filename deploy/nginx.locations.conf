location = /rule-library {
    return 301 /rule-library/;
}

location ^~ /rule-library/ {
    alias /opt/trust-rule-engine/frontend/dist/;
    index index.html;
    try_files $uri $uri/ /rule-library/index.html;
}

location ^~ /api/rule-library/ {
    proxy_pass http://127.0.0.1:18102/api/rule-library/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location ^~ /api/rule-engine/ {
    proxy_pass http://127.0.0.1:18102/api/rule-engine/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
